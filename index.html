<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e67e22;
            --primary-hover: #d35400;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 側邊欄樣式 */
        #sidebar {
            width: 400px;
            height: 100%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .header {
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .controls {
            padding: 15px 20px;
            background-color: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box, .filter-box {
            position: relative;
        }

        .search-box input, .filter-box select {
            width: 100%;
            padding: 10px 12px 10px 35px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-box select {
            padding-left: 35px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23718096' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }

        .search-box input:focus, .filter-box select:focus {
            border-color: var(--primary-color);
        }

        .search-box i, .filter-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .counter {
            font-size: 0.85rem;
            color: #718096;
            padding: 5px 20px;
            background: #f1f5f9;
        }

        .shop-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .shop-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .shop-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.15);
            transform: translateY(-2px);
        }

        .shop-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-tag {
            font-size: 0.75rem;
            background-color: #feebc8;
            color: #c05621;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        .shop-info {
            font-size: 0.85rem;
            color: #4a5568;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-comment {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 8px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 4px;
            line-height: 1.4;
        }

        /* 地圖區域樣式 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Leaflet Popup 樣式優化 */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }

        .popup-container {
            padding: 5px;
            max-width: 250px;
        }

        .popup-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .popup-detail {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #4a5568;
        }

        .popup-comment {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #edf2f7;
        }

        .nav-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }

            #sidebar {
                width: 100%;
                height: 45vh;
            }

            #map {
                height: 55vh;
            }
        }
    </style>
</head>

        // 初始化地圖（中心設於高雄市）
        const map = L.map('map').setView([22.6300, 120.3000], 13);

        // 載入 OpenStreetMap 圖資
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markers = [];
        const shopListElement = document.getElementById('shopList');
        const districtSelect = document.getElementById('districtSelect');
        const searchInput = document.getElementById('searchInput');
        const storeCounter = document.getElementById('storeCounter');

        // 初始化行政區選單選項
        function initDistrictFilter() {
            const districts = [...new Set(drinkShops.map(shop => shop.區域))];
            districts.forEach(dist => {
                const opt = document.createElement('option');
                opt.value = dist;
                opt.textContent = dist;
                districtSelect.appendChild(opt);
            });
        }

        // 建立地圖標記與彈窗
        function renderMapAndList(shops) {
            // 清除現有標記
            markers.forEach(m => map.removeLayer(m));
            markers.length = 0;
            shopListElement.innerHTML = '';

            storeCounter.textContent = `顯示 ${shops.length} 家飲料店`;

            shops.forEach((shop, index) => {
                // 1. 建立地圖 Marker
                const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.地址)}`;
                const popupContent = `
                    <div class="popup-container">
                        <div class="popup-title">${shop.店名}</div>
                        <div class="popup-detail"><i class="fa-solid fa-phone"></i> ${shop.電話}</div>
                        <div class="popup-detail"><i class="fa-solid fa-location-dot"></i> ${shop.地址}</div>
                        <div class="popup-comment">${shop.評論}</div>
                        <a href="${googleMapUrl}" target="_blank" class="nav-btn"><i class="fa-solid fa-diamond-turn-right"></i> 開啟 Google 地圖導航</a>
                    </div>
                `;

                const marker = L.marker([shop.lat, shop.lng])
                    .addTo(map)
                    .bindPopup(popupContent);
                
                markers.push(marker);

                // 2. 建立側邊欄卡片
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.innerHTML = `
                    <div class="shop-name">
                        <span>${shop.店名}</span>
                        <span class="shop-tag">${shop.區域}</span>
                    </div>
                    <div class="shop-info"><i class="fa-solid fa-phone"></i> ${shop.電話}</div>
                    <div class="shop-info"><i class="fa-solid fa-location-dot"></i> ${shop.地址}</div>
                    <div class="shop-comment">${shop.評論}</div>
                `;

                // 卡片點擊事件：移至該店家並開啟地圖彈窗
                card.addEventListener('click', () => {
                    map.flyTo([shop.lat, shop.lng], 16, { duration: 1 });
                    marker.openPopup();
                });

                shopListElement.appendChild(card);
            });
        }

        // 篩選與搜尋邏輯
        function filterShops() {
            const selectedDistrict = districtSelect.value;
            const searchText = searchInput.value.trim().toLowerCase();

            const filtered = drinkShops.filter(shop => {
                const matchDistrict = !selectedDistrict || shop.區域 === selectedDistrict;
                const matchSearch = !searchText || 
                    shop.店名.toLowerCase().includes(searchText) ||
                    shop.地址.toLowerCase().includes(searchText) ||
                    shop.電話.includes(searchText) ||
                    shop.評論.toLowerCase().includes(searchText);

                return matchDistrict && matchSearch;
            });

            renderMapAndList(filtered);
        }

        // 監聽輸入事件
        districtSelect.addEventListener('change', filterShops);
        searchInput.addEventListener('input', filterShops);

        // 初始執行
        initDistrictFilter();
        renderMapAndList(drinkShops);
    </script>
</body>
</html>
